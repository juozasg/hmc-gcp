[project]
name = "hmc-gcp"
version = "0.1.0"
description = "Tag ground control points in drone photos for ODM, and review the tags"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pyproj>=3.6",
    "opencv-python-headless>=4.8",
    "pygame-ce>=2.4",
    "pygame_gui>=0.6.10",
    "tifffile>=2024.1.30",
]

[project.scripts]
hmc-gcp = "hmc_gcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmc_gcp"]
